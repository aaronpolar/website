<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME - Aaron Polar</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            overflow: hidden; /* Landing page: no scroll */
        }

        .header-image {
            width: 100%;
            height: calc(100vh - 120px); /* Adjust height for header and footer */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-sizing: border-box;
        }

        .header-image img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        .footer-container {
            position: fixed; /* Pin footer to the bottom on the landing page */
            bottom: 0;
            box-sizing: border-box;
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <!-- Umami analytics (privacy-friendly). Replace data-website-id with your Umami Cloud website ID. -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="REPLACE_WITH_YOUR_UMAMI_WEBSITE_ID"></script>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="/">AARON</a>
            <a href="/">POLAR</a>
        </div>
        <div class="header-right">
            <a href="aboutme" class="green-button">About Me</a>
            <a href="fishing" class="green-button">Fishing</a>
            <a href="projects" class="green-button">Projects</a>
            <button id="themeToggle" class="theme-switch" type="button" role="switch" aria-label="Toggle dark mode"></button>
        </div>
    </div>
    <div class="header-image">
        <img src="docs/assets/folsomlake.JPG" alt="Folsom Lake">
    </div>
    <div class="footer-container">
        <a href="https://www.linkedin.com/in/aaronpolar" target="_blank">
            <img src="docs/assets/linkedinlogo.png" alt="LinkedIn Logo">
        </a>
        <a href="mailto:aaronmpolar@gmail.com">
            <img src="docs/assets/gmaillogo.png" alt="Gmail Logo">
        </a>
        <a href="https://www.github.com/aaronpolar" target="_blank">
            <img src="docs/assets/githublogo.png" alt="GitHub Logo">
        </a>
    </div>
</body>
</html>
