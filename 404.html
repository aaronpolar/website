<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found - Aaron Polar</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .notfound {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 24px;
        }

        .notfound h1 {
            font-size: 96px;
            margin: 0;
            color: #05472A;
            letter-spacing: -2px;
            line-height: 1;
        }

        .notfound h2 {
            font-size: 30px;
            margin: 8px 0 16px;
        }

        .notfound p {
            font-size: 19px;
            line-height: 1.6;
            color: #555;
            max-width: 560px;
            margin: 0 auto 12px;
        }

        .notfound .sub {
            font-size: 15px;
            color: #888;
            font-style: italic;
            margin-bottom: 28px;
        }

        .home-button {
            background-color: #05472A;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 12px 26px;
            font-family: baskerville, serif;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 16px;
            text-decoration: none;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .notfound h1 { font-size: 72px; }
            .notfound h2 { font-size: 24px; }
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <!-- Umami analytics (privacy-friendly) -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="32455286-fe20-4036-8269-8ed9782967e7"></script>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="/">AARON</a>
            <a href="/">POLAR</a>
        </div>
        <div class="header-right">
            <a href="aboutme" class="green-button">About Me</a>
            <a href="fishing" class="green-button">Fishing</a>
            <a href="projects" class="green-button">Projects</a>
            <button id="themeToggle" class="theme-switch" type="button" role="switch" aria-label="Toggle dark mode"></button>
        </div>
    </div>

    <div class="notfound">
        <h1>404</h1>
        <h2>Looks like this page got away.</h2>
        <p>We cast a line but couldn't reel in the page you were looking for. It may have been moved, renamed, or it slipped off the hook.</p>
        <p class="sub">404: page not found in the network.</p>
        <a class="home-button" href="/">Back to Home</a>
    </div>

    <div class="footer-container">
        <a href="https://www.linkedin.com/in/aaronpolar" target="_blank">
            <img src="docs/assets/linkedinlogo.png" alt="LinkedIn Logo">
        </a>
        <a href="mailto:aaronmpolar@gmail.com">
            <img src="docs/assets/gmaillogo.png" alt="Gmail Logo">
        </a>
        <a href="https://www.github.com/aaronpolar" target="_blank">
            <img src="docs/assets/githublogo.png" alt="GitHub Logo">
        </a>
    </div>
</body>
</html>
