<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERSONAL BESTS - Aaron Polar</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .content-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 20px 0;
        }

        .text-container {
            text-align: center;
        }

        .text-container h2, .text-container h3, .text-container h4 {
            margin: 10px 0;
            font-weight: normal;
        }

        .slideshow-container {
            position: relative;
            width: 25vw; /* Match the width to the size of mybestcatch.jpg */
            height: 25vw; /* Maintain a 1:1 aspect ratio */
            max-width: 500px;
            max-height: 500px;
            margin: auto;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .slides {
            display: none;
            width: 100%;
            height: 100%;
        }

        .slides img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            border-radius: 0 3px 3px 0;
            user-select: none;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }

        .prev:hover, .next:hover {
            background-color: rgba(0, 0, 0, 1);
        }

        .my-best-catch {
            text-align: center;
            margin-top: 20px;
        }

        .my-best-catch img {
            width: 25vw;
            height: auto;
            object-fit: cover;
        }

        @media (max-width: 768px) {
            .slideshow-container {
                width: 90vw;
                height: 90vw;
                max-width: 90vw;
                max-height: 90vw;
            }

            .my-best-catch img {
                width: 90vw;
                height: auto;
            }
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <!-- Umami analytics (privacy-friendly) -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="32455286-fe20-4036-8269-8ed9782967e7"></script>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="/">AARON</a>
            <a href="/">POLAR</a>
        </div>
        <div class="header-right">
            <a href="aboutme" class="green-button">About Me</a>
            <a href="fishing" class="green-button">Fishing</a>
            <a href="projects" class="green-button">Projects</a>
            <button id="themeToggle" class="theme-switch" type="button" role="switch" aria-label="Toggle dark mode"></button>
        </div>
    </div>

    <div class="back-button-bar">
        <a href="javascript:history.back()" class="back-button">&#8592; Back</a>
    </div>

    <div class="content">
        <div class="slideshow-container">
            <div class="slides">
                <img src="docs/assets/fishingintherain.jpg" alt="Fishing in the Rain">
            </div>
            <div class="slides">
                <img src="docs/assets/pbrainbowtrout02192024.jpg" alt="Rainbow Trout">
            </div>
            <div class="slides">
                <img src="docs/assets/pbsmallmouthbass05262024.jpg" alt="Smallmouth Bass">
            </div>
            <div class="slides">
                <img src="docs/assets/jakebass.jpg" alt="Jake Bass">
            </div>
            <div class="slides">
                <img src="docs/assets/basspillow.jpg" alt="Bass Pillow">
            </div>
            <div class="slides">
                <img src="docs/assets/threerainbowtrout.jpg" alt="Three Rainbow Trout">
            </div>
            <a class="prev" onclick="plusSlides(-1)">❮</a>
            <a class="next" onclick="plusSlides(1)">❯</a>
        </div>
    </div>
    <div class="content-container">
        <div class="text-container">
            <h1>Personal Bests</h1>
            <h3>Freshwater Fish</h3>
            <h4>Rainbow Trout (stocked): 2.2 lbs, 12 inches</h4>
            <h4>Smallmouth Bass: 5 lbs, 10 inches</h4>
        </div>


        <div class="my-best-catch">
            <h1>My Best Catch</h1>
            <img src="docs/assets/mybestcatch.jpg" alt="My Best Catch">
        </div>
    </div>

    <script>
        let slideIndex = 1;
        showSlides(slideIndex);

        function plusSlides(n) {
            showSlides(slideIndex += n);
        }

        function showSlides(n) {
            let i;
            let slides = document.getElementsByClassName("slides");
            if (n > slides.length) { slideIndex = 1 }
            if (n < 1) { slideIndex = slides.length }
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            slides[slideIndex - 1].style.display = "block";
        }
    </script>

    <!-- Footer -->
    <div class="footer-container">
        <a href="https://www.linkedin.com/in/aaronpolar" target="_blank">
            <img src="docs/assets/linkedinlogo.png" alt="LinkedIn Logo">
        </a>
        <a href="mailto:aaronmpolar@gmail.com">
            <img src="docs/assets/gmaillogo.png" alt="Gmail Logo">
        </a>
        <a href="https://www.github.com/aaronpolar" target="_blank">
            <img src="docs/assets/githublogo.png" alt="GitHub Logo">
        </a>
    </div>
</body>
</html>
