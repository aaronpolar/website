<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG A CATCH - Aaron Polar</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .log-entry-form {
            text-align: center;
            margin: 20px auto;
            max-width: 400px;
            flex: 1;
        }

        .log-entry-form h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .log-entry-form input,
        .log-entry-form button {
            display: block;
            padding: 10px;
            margin: 8px auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: baskerville, serif;
            font-size: 16px;
            width: 80%;
        }

        .log-entry-form button {
            background-color: #05472A;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .log-entry-form button:hover {
            background-color: #033d23;
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="index.html">AARON</a>
            <a href="index.html">POLAR</a>
        </div>
        <div class="header-right">
            <a href="aboutme.html" class="green-button">About Me</a>
            <a href="fishing.html" class="green-button">Fishing</a>
            <a href="projects.html" class="green-button">Projects</a>
            <button id="themeToggle" class="theme-switch" type="button" role="switch" aria-label="Toggle dark mode"></button>
        </div>
    </div>

    <div class="back-button-bar">
        <a href="javascript:history.back()" class="back-button">&#8592; Back</a>
    </div>

    <div class="log-entry-form">
        <h2>Log a New Catch</h2>
        <form id="logForm">
            <input type="datetime-local" id="datetime" name="datetime" required>
            <input type="text" id="location" name="location" placeholder="Location" required>
            <input type="text" id="species" name="species" placeholder="Species" required>
            <input type="number" id="length" name="length" placeholder="Length (optional)" step="0.01">
            <input type="number" id="weight" name="weight" placeholder="Weight (optional)" step="0.01">
            <button type="submit">Log Catch</button>
        </form>
    </div>

    <div class="footer-container">
        <a href="https://www.linkedin.com/in/aaronpolar" target="_blank">
            <img src="docs/assets/linkedinlogo.png" alt="LinkedIn Logo">
        </a>
        <a href="mailto:aaronmpolar@gmail.com">
            <img src="docs/assets/gmaillogo.png" alt="Gmail Logo">
        </a>
        <a href="https://www.github.com/aaronpolar" target="_blank">
            <img src="docs/assets/githublogo.png" alt="GitHub Logo">
        </a>
    </div>

    <script>
        document.getElementById('logForm').addEventListener('submit', function(event) {
            event.preventDefault();

            var datetime = document.getElementById('datetime').value;
            var location = document.getElementById('location').value;
            var species = document.getElementById('species').value;
            var length = document.getElementById('length').value || 'Not specified';
            var weight = document.getElementById('weight').value || 'Not specified';

            var dateTimeParts = datetime.split('T');
            var date = dateTimeParts[0];
            var time = dateTimeParts[1];

            var templateParams = {
                date: date,
                time: time,
                location: location,
                species: species,
                length: length,
                weight: weight
            };

            emailjs.send('service_fuwd637', 'template_84duy1a', templateParams)
                .then(function(response) {
                    console.log('SUCCESS!', response.status, response.text);
                    alert('Log entry submitted successfully!');
                    document.getElementById('logForm').reset();
                }, function(error) {
                    console.log('FAILED...', error);
                    alert('Failed to submit log entry. Please try again later.');
                });
        });
    </script>
</body>
</html>
